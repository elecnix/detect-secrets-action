name: Duplication

on: pull_request

concurrency:
  group: dupdelta-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dupdelta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (node24)
        with:
          fetch-depth: 0  # the merge-base has to be reachable; a shallow clone fails the action loudly

      # A tag, not a SHA like the checkout above: the action resolves its own
      # release binary from the ref it was called with, and a SHA names no
      # release, so pinning one would silently fall back to "latest".
      - uses: elecnix/dupdelta@v0.2.0
        with:
          # The default root scan skips dot-directories, which would leave
          # .github/fixtures.py -- a third of this repo's Python -- invisible.
          paths: ". .github"
