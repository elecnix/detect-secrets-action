name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (node24)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0 (node24)
        with:
          python-version: "3.12"
      - run: pip install --quiet pytest "detect-secrets==1.5.0"
      - run: pytest test_gate.py -q

  # The gate has never been seen to fail -> not tested. These drive the real
  # gate.py against real fixture repos with a real detect-secrets install.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clean-passes
            expect: 0
          - name: planted-secret-fails
            expect: 1
          - name: drift-passes
            expect: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0 (node24)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0 (node24)
        with:
          python-version: "3.12"
      - run: pip install --quiet "detect-secrets==1.5.0"
      - name: Build fixture repo and run the gate
        run: python3 .github/fixtures.py "${{ matrix.name }}"
